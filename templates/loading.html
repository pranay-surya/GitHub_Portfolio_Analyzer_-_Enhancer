{% extends "base.html" %}

{% block title %}Analyzing @{{ username }}...{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 text-center">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5">
                    <div class="spinner-border text-primary mb-4" style="width: 4rem; height: 4rem;" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <h3 class="mb-3">Analyzing @{{ username }}</h3>
                    <p class="text-muted mb-4" id="statusText">Fetching GitHub data...</p>
                    
                    <div class="progress mb-4" style="height: 10px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                             id="progressBar" 
                             style="width: 10%"></div>
                    </div>
                    
                    <div class="steps text-start">
                        <div class="step" id="step1">
                            <i class="bi bi-check-circle text-muted me-2"></i>
                            Fetching profile data...
                        </div>
                        <div class="step" id="step2">
                            <i class="bi bi-circle text-muted me-2"></i>
                            Analyzing repositories...
                        </div>
                        <div class="step" id="step3">
                            <i class="bi bi-circle text-muted me-2"></i>
                            Calculating score...
                        </div>
                        <div class="step" id="step4">
                            <i class="bi bi-circle text-muted me-2"></i>
                            Generating feedback...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Auto-submit the form after page loads
    window.onload = function() {
        setTimeout(function() {
            document.getElementById('analyzeForm').submit();
        }, 500);
    };
</script>

<form id="analyzeForm" action="{{ url_for('analyze') }}" method="POST" style="display: none;">
    <input type="hidden" name="username" value="{{ username }}">
</form>
{% endblock %}
